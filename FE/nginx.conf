server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Per-deploy cache headers. Without these the browser caches the old
    # index.html (and thus references to old hashed assets) across deploys,
    # forcing a manual refresh to see new UI — e.g. the responsive layout.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Vite emits content-hashed filenames, so these are safe to cache
    # aggressively forever. A new build produces new filenames + a new
    # index.html that references them.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
