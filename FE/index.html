<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WorkX</title>
    <script src="/env-config.js"></script>
    <!-- Belt-and-suspenders cache control for older mobile WebViews / Android
         browsers that don't strictly honor HTTP Cache-Control. The HTTP
         response headers (set by workx.conf + the FE container's nginx.conf)
         are the authoritative source; these meta tags only act as a hint. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Bump WORKX_BUNDLE_VERSION on every deploy. The runtime guard in
         main.tsx compares this to the value compiled into the bundle; if they
         diverge (e.g. the browser served a stale cached index.html pointing
         at an older bundle, or restored the page from bfcache), we force a
         single reload to pick up the current bundle. -->
    <meta name="workx-bundle-version" content="responsive-2026-08-12" />
    <style>
      /* Critical mobile shell CSS — inlined so the authenticated layout is
         mobile on first paint, before the JS bundle injects the full
         stylesheet. Without this, phones briefly render the desktop shell
         (240px fixed sidebar) until /assets/*.css loads, which on a cold
         or cached load looks like "desktop layout until refresh".
         Desktop is unaffected — everything is gated behind max-width:960px. */
      html, body { margin: 0; padding: 0; }
      #root { min-height: 100vh; }
      @media (max-width: 960px) {
        html, body { overflow-x: hidden; }
        /* Hide the fixed desktop sidebar off-canvas immediately. The app
           later adds a transform-based drawer toggle; this just makes sure
           it never occupies 240px on a phone before JS/CSS loads. */
        .app-sider {
          position: fixed !important;
          left: 0; top: 0; bottom: 0;
          width: 240px !important;
          transform: translateX(-100%);
          transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
          z-index: 200;
        }
        .app-content-area { margin-left: 0 !important; }
        .sider-collapse-btn { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
