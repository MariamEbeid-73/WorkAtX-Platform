# HTTP -> HTTPS redirect + Let's Encrypt webroot (certbot)
server {
    listen 80;
    server_name workx-iti.com api.workx-iti.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name workx-iti.com;

    ssl_certificate     /etc/letsencrypt/live/workx-iti.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workx-iti.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name api.workx-iti.com;

    ssl_certificate     /etc/letsencrypt/live/workx-iti.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workx-iti.com/privkey.pem;

    client_max_body_size 10m;

    location ^~ /workx-resumes/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
