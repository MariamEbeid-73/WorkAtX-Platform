services:
  db:
    image: postgres:16-alpine
    container_name: workx-db
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-WorkX@Password2026}"
      POSTGRES_DB: "${DB_NAME:-WorkXDb}"
    ports:
      - "5432:5432"
    volumes:
      - workx-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-WorkXDb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  be:
    build:
      context: ./BE
      dockerfile: Dockerfile
      cache_from:
        - workx-be:latest
    image: workx-be:latest
    container_name: workx-be
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      Clerk__Authority: "${CLERK_AUTHORITY}"
      ConnectionStrings__DefaultConnection: >
        Host=db;Port=5432;Database=${DB_NAME:-WorkXDb};
        Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-WorkX@Password2026};
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  fe:
    build:
      context: ./FE
      dockerfile: Dockerfile
      cache_from:
        - workx-fe:latest
    image: workx-fe:latest
    container_name: workx-fe
    environment:
      VITE_API_URL: "${VITE_API_URL:-http://localhost:5000}"
      VITE_CLERK_PUBLISHABLE_KEY: "${VITE_CLERK_PUBLISHABLE_KEY}"
    ports:
      - "4200:80"
    depends_on:
      - be

volumes:
  workx-db-data:
