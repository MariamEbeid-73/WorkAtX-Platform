services:
  db:
    image: postgres:16-alpine
    container_name: workx-db
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-WorkX@Password2026}"
      POSTGRES_DB: "${DB_NAME:-WorkXDb}"
    ports:
      - "5432:5432"
    volumes:
      - workx-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-WorkXDb}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: workx-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # Web UI — visit http://localhost:9001 to browse buckets
    volumes:
      - workx-minio-data:/data
      - ./certs:/root/.minio/certs
    healthcheck:
      test: [ "CMD-SHELL", "curl -kI https://localhost:9000/minio/health/live || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  be:
    build:
      context: ./BE
      dockerfile: Dockerfile
      cache_from:
        - workx-be:latest
    image: workx-be:latest
    container_name: workx-be
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      Clerk__Authority: "${CLERK_AUTHORITY}"
      ConnectionStrings__DefaultConnection: >
        Host=db;Port=5432;Database=${DB_NAME:-WorkXDb}; Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-WorkX@Password2026};
      S3__Endpoint: "http://minio:9000"
      S3__BucketName: "${S3_BUCKET_NAME:-workx-resumes}"
      S3__AccessKey: "${AWS_ACCESS_KEY_ID:-minioadmin}"
      S3__SecretKey: "${AWS_SECRET_ACCESS_KEY:-minioadmin}"
      S3__Region: "${AWS_REGION:-us-east-1}"
      OAuth__GitHub__ClientId: "${GITHUB_CLIENT_ID}"
      OAuth__GitHub__ClientSecret: "${GITHUB_CLIENT_SECRET}"
      OAuth__GitHub__RedirectUri: "http://localhost:5000/oauth/github/callback"
      OAuth__LinkedIn__ClientId: "${LINKEDIN_CLIENT_ID}"
      OAuth__LinkedIn__ClientSecret: "${LINKEDIN_CLIENT_SECRET}"
      OAuth__LinkedIn__RedirectUri: "http://localhost:5000/oauth/linkedin/callback"
      OAuth__FrontendCallbackUrl: "${VITE_API_URL:-http://localhost:5173}/connected-accounts"
      Encryption__Key: "${ENCRYPTION_KEY}"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  fe:
    build:
      context: ./FE
      dockerfile: Dockerfile
      cache_from:
        - workx-fe:latest
    image: workx-fe:latest
    container_name: workx-fe
    environment:
      VITE_API_URL: "${VITE_API_URL:-http://localhost:5000}"
      VITE_CLERK_PUBLISHABLE_KEY: "${VITE_CLERK_PUBLISHABLE_KEY}"
    ports:
      - "4200:80"
    depends_on:
      - be

volumes:
  workx-db-data:
  workx-minio-data:
